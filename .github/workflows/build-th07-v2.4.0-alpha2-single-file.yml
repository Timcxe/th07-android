name: Build TH07 Android v2.4.0-alpha2 (Practice RETRY checkpoint)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Fetch pinned TH07 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/some100/th07.git upstream
          cd upstream
          git fetch --depth=1 origin 5412dc42f25951de96d0b094b97fb916652ea1bf
          git checkout --detach 5412dc42f25951de96d0b094b97fb916652ea1bf
          git submodule update --init --recursive --depth 1

